<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Діаграми: тест</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f1fb;--card:#fffdf6;--text:#16305c;--muted:#51648a;--line:#c9d6ea;--accent:#16305c;--accent-text:#fff;--sun:#ffc928;--ok:#1f7a45;--okbg:#e2f5ea;--bad:#b3322f;--badbg:#fde7e6;--grid:#b8c4d8;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b34;--card:#162747;--text:#eef3ff;--muted:#a9b8d6;--line:#2d4268;--accent:#ffc928;--accent-text:#16305c;--ok:#6fdc9a;--okbg:#14382a;--bad:#ff938f;--badbg:#42201f;--grid:#3a4d73;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1b34;--card:#162747;--text:#eef3ff;--muted:#a9b8d6;--line:#2d4268;--accent:#ffc928;--accent-text:#16305c;--ok:#6fdc9a;--okbg:#14382a;--bad:#ff938f;--badbg:#42201f;--grid:#3a4d73;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.5 Nunito,"Segoe UI",system-ui,sans-serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-text);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;font-weight:800}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--accent);z-index:10}
.bar button{font:inherit;font-size:14px;border:2px solid currentColor;background:transparent;color:inherit;border-radius:20px;padding:4px 12px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:30px;line-height:1.15;margin:8px 0 6px}
.lead{color:var(--muted);margin:0 0 22px}
section{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 16px;margin-bottom:26px}
h2{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 12px;font-size:15px}
.chart{border:2px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;color:var(--text)}
.chart svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;margin:0 0 18px;padding:0;list-style:none}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px;border:1px solid var(--text)}
.q{border-top:2px dashed var(--line);padding:14px 0 6px}
.q p{margin:0 0 4px;font-weight:800}
.hint{font-size:14px;color:var(--muted);margin:0 0 8px}
.opt{display:flex;gap:10px;align-items:center;padding:9px 12px;margin:6px 0;border:2px solid var(--line);border-radius:12px;cursor:pointer;min-height:44px}
.opt:has(input:checked){border-color:var(--text);background:color-mix(in srgb,var(--sun) 22%,transparent)}
.opt input{width:20px;height:20px;accent-color:var(--text);flex:none}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt .m{margin-left:auto;font-weight:800}
.opt.ok .m{color:var(--ok)}.opt.no .m{color:var(--bad)}
.go{font:inherit;font-weight:800;background:var(--accent);color:var(--accent-text);border:0;border-radius:12px;padding:9px 20px;margin:8px 0;cursor:pointer;min-height:44px}
.go:disabled{opacity:.4;cursor:default}
.fb{margin:6px 0 4px;padding:10px 12px;border-radius:12px;font-size:16px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--badbg);color:var(--bad)}
.fb b{display:block}
.fb span{color:var(--text)}
.end{display:none;text-align:center;font-size:20px;font-weight:800;padding:22px 16px;border:3px solid var(--sun);border-radius:18px;background:var(--card)}
.end.show{display:block}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<div class="bar"><span>Правильно: <span id="sc">0</span> з <span id="tot">0</span></span><button id="reset" type="button">Новий варіант</button></div>
<main>
<h1>Розглянь діаграму і дай відповідь на запитання</h1>
<p class="lead">Три діаграми — гістограма, графік і кругова діаграма. Обери відповідь і натисни «Перевірити». Числа щоразу нові.</p>
<div id="app"></div>
<div class="end" id="end"></div>
</main>
<script>
const NS="http://www.w3.org/2000/svg";
const svgOpen=(w,h,label)=>`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}" xmlns="${NS}" font-family="Nunito,sans-serif" font-size="14" fill="currentColor">`;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const sample=(a,n)=>shuf(a).slice(0,n);
const sum=a=>a.reduce((x,y)=>x+y,0);
const cap=t=>t[0].toUpperCase()+t.slice(1);
const pl=(n,a,b,c)=>{const m=n%100,d=n%10;return m>10&&m<15?c:d===1?a:d>1&&d<5?b:c};
function num(q,c,cands,w,unit=""){
  let set=[];for(const x of cands)if(x>0&&x!==c&&!set.includes(x))set.push(x);
  set=set.slice(0,3);
  for(let d=1;set.length<3;d++)for(const x of [c+d,c-d])if(x>0&&x!==c&&!set.includes(x)&&set.length<3)set.push(x);
  const o=shuf([c,...set]);return{q,o:o.map(x=>x+unit),a:[o.indexOf(c)],w};
}
function pick(q,opts,ci,w,hint){const o=shuf(opts.map((t,i)=>[t,i===ci]));return{q,o:o.map(x=>x[0]),a:o.map((x,i)=>x[1]?i:-1).filter(i=>i>=0),w,hint}}

function barChart(S,cls){
  const W=520,H=320,L=40,R=10,T=12,B=34,pw=W-L-R,ph=H-T-B,max=18;
  const y=v=>T+ph-v/max*ph;let s=svgOpen(W,H,"Гістограма: улюблені домашні тварини учнів трьох класів");
  for(let v=0;v<=max;v+=2)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+5}" text-anchor="end">${v}</text>`;
  s+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}" stroke="currentColor"/>`;
  const gw=pw/3,bw=gw*.2;
  cls.forEach((c,i)=>{const x0=L+i*gw+gw/2-1.5*bw;
    S.forEach(([col,vals],k)=>{const v=vals[i];s+=`<rect x="${x0+k*bw}" y="${y(v)}" width="${bw}" height="${ph-(y(v)-T)}" fill="${col}" stroke="currentColor" stroke-width=".8"/>`});
    s+=`<text x="${L+i*gw+gw/2}" y="${H-10}" text-anchor="middle" font-weight="800">${c}</text>`});
  return s+"</svg>";
}
function lineChart(S){
  const W=520,H=320,L=40,R=14,T=12,B=34,pw=W-L-R,ph=H-T-B,max=35;
  const x=i=>L+pw*(i+.5)/5,y=v=>T+ph-v/max*ph;let s=svgOpen(W,H,"Лінійна діаграма: висота соняшника і квасолі за п’ять тижнів");
  for(let v=0;v<=max;v+=5)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+5}" text-anchor="end">${v}</text>`;
  S.forEach(([col,vals])=>{s+=`<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${vals.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`;
    vals.forEach((v,i)=>s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="${col}"/>`)});
  for(let i=0;i<5;i++)s+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-weight="800">${i+1} тиж.</text>`;
  return s+"</svg>";
}
function pieChart(data){
  const tot=sum(data.map(d=>d[1])),cx=160,cy=135,r=115;let a=-Math.PI/2;
  let s=svgOpen(320,270,"Кругова діаграма: улюблені фрукти дітей");
  data.forEach(([n,v,c])=>{const b=a+v/tot*2*Math.PI,large=b-a>Math.PI?1:0;
    s+=`<path d="M${cx} ${cy}L${cx+r*Math.cos(a)} ${cy+r*Math.sin(a)}A${r} ${r} 0 ${large} 1 ${cx+r*Math.cos(b)} ${cy+r*Math.sin(b)}Z" fill="${c}" stroke="#16305c" stroke-width="2"/>`;
    const m=(a+b)/2;s+=`<text x="${cx+r*.62*Math.cos(m)}" y="${cy+r*.62*Math.sin(m)+7}" text-anchor="middle" font-size="22" font-weight="800" fill="#16305c">${v}</text>`;a=b});
  return s+"</svg>";
}

function genBar(){
  const cls=["3-А","3-Б","3-В"];
  const an=[{n:"коти",acc:"котів",sg:"кіт",c:"#4f81bd"},{n:"собаки",acc:"собак",sg:"собака",c:"#c0504d"},{n:"хом’яки",acc:"хом’яків",sg:"хом’як",c:"#2230e6"}];
  let v,cs;do{v=an.map(()=>sample(range(3,17),3));cs=[0,1,2].map(i=>sum(v.map(x=>x[i])))}while(cs.some(x=>x<15||x>35));
  const [a1,a2,a3]=shuf([0,1,2]);
  const all=sum(cs);
  const qs=[];
  const m=v[a1].indexOf(Math.max(...v[a1]));
  qs.push(pick(`В якому класі найбільше дітей люблять ${an[a1].acc}?`,cls,m,`У ${cls[m]} стовпчик (${an[a1].n}) найвищий — ${v[a1][m]} дітей.`));
  const t=v[a2],f=x=>cls.map((c,i)=>`${c} — ${x[i]}`).join(", ");
  const bad=[v[a1],[...t].reverse(),t.map((x,i)=>i===1?x+1:x),t.map((x,i)=>i===0?x-1:x),v[a3]].map(f);
  const wrong=[...new Set(bad)].filter(x=>x!==f(t)).slice(0,3);
  qs.push(pick(`Скільки дітей люблять ${an[a2].acc} у ${cls[0]}, у ${cls[1]}, у ${cls[2]}?`,[f(t),...wrong],0,`Стовпчики (${an[a2].n}): ${t.join(", ")}.`));
  qs.push(num(`Для скількох дітей з усіх 3-х класів ${an[a3].sg} — улюблена тварина?`,sum(v[a3]),[sum(v[a3])-v[a3][0],sum(v[a3])-v[a3][2],sum(v[a3])+v[a3][1]],`${v[a3].join(" + ")} = ${sum(v[a3])}.`));
  const c=rnd(0,2),cv=v.map(x=>x[c]);
  qs.push(num(`Скільки дітей ${cls[c]} класу брали участь в опитуванні?`,cs[c],shuf(cv.map(x=>cs[c]-x)),`${cv.join(" + ")} = ${cs[c]}.`));
  const k=rnd(0,2),a=rnd(0,2),w=v[a][k],o=v[a][(k+1)%3];
  qs.push(pick(`Чи можеш відповісти, скільком дівчаткам з ${cls[k]} класу подобаються ${an[a].n}?`,[`Так, ${w} ${pl(w,"дівчинці","дівчинкам","дівчаткам")}`,"Ні, діаграма не показує, скільки з них дівчаток",`Так, ${o} ${pl(o,"дівчинці","дівчинкам","дівчаткам")}`],1,"Діаграма показує лише кількість дітей, а не окремо хлопців і дівчаток."));
  qs.push(num("Скільки всього дітей 3-х класів брали участь в опитуванні?",all,shuf(cs.map(x=>all-x)).concat([all+10]),cs.map((x,i)=>`${cls[i]}: ${x}`).join(". ")+`. Разом ${cs.join(" + ")} = ${all}.`));
  return{title:"1. Гістограма",sub:"Яку домашню тварину найбільше люблять діти у трьох третіх класах.",svg:barChart(an.map((x,i)=>[x.c,v[i]]),cls),legend:an.map(x=>[x.c,x.n]),qs};
}

function genLine(){
  let s,b,inc,k;
  for(;;){
    inc=[0,0,0,0].map(()=>rnd(3,7));const mx=Math.max(...inc);
    if(inc.filter(x=>x===mx).length!==1)continue;
    s=[rnd(4,7)];inc.forEach(d=>s.push(s[s.length-1]+d));
    if((s[0]+s[1]+s[2])%3)continue;
    k=rnd(2,3);b=s.map((x,i)=>i===0||i===k?x:x-rnd(1,4));
    if(b.every((x,i)=>x>0&&(i===0||x>=b[i-1])))break;
  }
  const P=[{g:"соняшника",col:"#d97f00",l:"помаранчева",v:s},{g:"квасолі",col:"#1fa84a",l:"зелена",v:b}];
  const qs=[],p=rnd(0,1),w=rnd(1,4),arr=P[p].v,oth=P[1-p].v;
  qs.push(num(`Якою була висота ${P[p].g} на ${w+1}-му тижні?`,arr[w],[arr[w-1],arr[w+1],oth[w]],`${cap(P[p].l)} лінія на ${w+1}-му тижні — на позначці ${arr[w]}.`," см"));
  const w2=sample([1,2,3,4].filter(i=>i!==k),1)[0],d=s[w2]-b[w2];
  qs.push(num(`На скільки сантиметрів соняшник був вищий за квасолю на ${w2+1}-му тижні?`,d,[s[w2],b[w2],d+1],`${s[w2]} − ${b[w2]} = ${d} см.`," см"));
  const m=sample([1,2,3,4].filter(i=>i!==k),1)[0];
  qs.push(Object.assign(pick("Які твердження правильні?",[`На 1-му тижні обидві рослини мали по ${s[0]} см`,`На ${k+1}-му тижні обидві рослини мали по ${s[k]} см`,"Квасоля завжди була вищою за соняшник",`На ${m+1}-му тижні рослини були однакової висоти`],0,`Лінії зустрічаються на 1-му (${s[0]} см) і ${k+1}-му (${s[k]} см) тижні. На ${m+1}-му тижні було ${s[m]} і ${b[m]} см.`,"Обери всі правильні відповіді."),{}));
  const last=qs[qs.length-1];
  const txt=[`На 1-му тижні обидві рослини мали по ${s[0]} см`,`На ${k+1}-му тижні обидві рослини мали по ${s[k]} см`];
  last.a=last.o.map((t,i)=>txt.includes(t)?i:-1).filter(i=>i>=0);
  const sm=s[0]+s[1]+s[2],av=sm/3;
  qs.push(num("Знайди середню висоту соняшника за перші три тижні.",av,[sm,s[2],av+1],`(${s[0]} + ${s[1]} + ${s[2]}) ÷ 3 = ${sm} ÷ 3 = ${av} см.`," см"));
  const j=inc.indexOf(Math.max(...inc));
  qs.push(pick("За який тиждень соняшник виріс найбільше?",[0,1,2,3].map(i=>`З ${i+1}-го на ${i+2}-й`),j,`Зріст: ${inc.map(x=>"+"+x).join(", ")} см. Найбільше — з ${j+1}-го на ${j+2}-й тиждень (+${inc[j]} см).`));
  return{title:"2. Лінійна діаграма (графік)",sub:"Висота соняшника й квасолі (у сантиметрах), яку вимірювали щотижня протягом п’яти тижнів.",svg:lineChart(P.map(x=>[x.col,x.v])),legend:P.map(x=>[x.col,x.g==="соняшника"?"соняшник":"квасоля"]),qs};
}

function genPie(){
  const F=[["яблука","#f08a89"],["банани","#f6d743"],["апельсини","#f5a54a"],["груші","#9fd17a"],["виноград","#b39ddb"]];
  const val=sample(range(2,9),5),data=F.map((f,i)=>[f[0],val[i],f[1]]),tot=sum(val);
  const [i1,i2,i3,i4,i5]=shuf([0,1,2,3,4]),n=i=>F[i][0],qs=[];
  qs.push(num(`Скільки дітей обрали ${n(i1)}?`,val[i1],[val[i1]+1,val[i1]-1,val[i2]],`Сектор «${n(i1)}» — ${val[i1]}.`));
  qs.push(num(`Скільки учнів обрали ${n(i2)}?`,val[i2],[val[i2]+1,val[i2]-1,val[i1]],`Сектор «${n(i2)}» — ${val[i2]}.`));
  qs.push(num("Скільки всього дітей брали участь в опитуванні?",tot,[tot-val[i3],tot+1,tot-1],`${val.join(" + ")} = ${tot}.`));
  const mx=val.indexOf(Math.max(...val)),ch=[mx,...sample([0,1,2,3,4].filter(i=>i!==mx),3)];
  qs.push(pick("Який фрукт найпопулярніший серед дітей?",ch.map(i=>cap(n(i))),0,`У «${n(mx)}» найбільший сектор — ${val[mx]} дітей.`));
  qs.push(num(`Скільки дітей разом обрали ${n(i3)} й ${n(i4)}?`,val[i3]+val[i4],[Math.abs(val[i3]-val[i4]),val[i3]+val[i4]+1,tot],`${val[i3]} + ${val[i4]} = ${val[i3]+val[i4]}.`));
  const [hi,lo]=val[i1]>val[i5]?[i1,i5]:[i5,i1],df=val[hi]-val[lo];
  qs.push(num(`На скільки менше дітей любить ${n(lo)}, ніж ${n(hi)}?`,df,[val[hi]+val[lo],df+1,val[lo]],`${val[hi]} − ${val[lo]} = ${df}.`));
  const f=rnd(0,4),a=rnd(1,val[f]-1);
  qs.push(pick(`Чи можна відповісти, скільки окремо хлопців і окремо дівчаток обрали ${n(f)}?`,[`Так, ${a} ${pl(a,"хлопець","хлопці","хлопців")} і ${val[f]-a} ${pl(val[f]-a,"дівчинка","дівчинки","дівчаток")}`,"Ні, діаграма цього не показує"],1,"Діаграма показує лише загальну кількість дітей."));
  return{title:"3. Кругова діаграма",sub:"Який фрукт вибрали діти (числа вказані на діаграмі).",svg:pieChart(data),legend:F.map(f=>[f[1],f[0]]),qs};
}

const app=document.getElementById("app"),sc=document.getElementById("sc"),tot=document.getElementById("tot"),end=document.getElementById("end");
let done=0,good=0,all=0;
function build(){
  const T=[genBar(),genLine(),genPie()];
  app.innerHTML="";done=good=0;all=0;end.className="end";
  T.forEach((t,ti)=>{
    const sec=document.createElement("section");
    sec.innerHTML=`<h2>${t.title}</h2><p class="sub">${t.sub}</p><div class="chart">${t.svg}</div><ul class="legend">${t.legend.map(l=>`<li><i style="background:${l[0]}"></i>${l[1]}</li>`).join("")}</ul>`;
    t.qs.forEach((q,qi)=>{
      all++;const multi=q.a.length>1,name=`q${ti}_${qi}`,box=document.createElement("div");box.className="q";
      box.innerHTML=`<p>${qi+1}) ${q.q}</p>${q.hint?`<div class="hint">${q.hint}</div>`:""}`+
        q.o.map((o,oi)=>`<label class="opt"><input type="${multi?"checkbox":"radio"}" name="${name}" value="${oi}"><span>${o}</span><span class="m"></span></label>`).join("")+
        `<button type="button" class="go">Перевірити</button><div class="fb" hidden></div>`;
      const btn=box.querySelector(".go"),fb=box.querySelector(".fb");
      btn.onclick=()=>{
        const ins=[...box.querySelectorAll("input")],sel=ins.filter(i=>i.checked).map(i=>+i.value);
        if(!sel.length){fb.hidden=false;fb.className="fb no";fb.innerHTML="<b>Спочатку обери відповідь.</b>";return}
        const okAll=sel.length===q.a.length&&sel.every(v=>q.a.includes(v));
        ins.forEach((i,k)=>{i.disabled=true;const lab=i.parentElement,m=lab.querySelector(".m");
          if(q.a.includes(k)){lab.classList.add("ok");m.textContent="✓"}else if(i.checked){lab.classList.add("no");m.textContent="✗"}});
        fb.hidden=false;fb.className="fb "+(okAll?"ok":"no");
        fb.innerHTML=`<b>${okAll?"✓ Правильно!":"✗ Неправильно."}</b><span>${q.w}</span>`;
        btn.disabled=true;done++;if(okAll)good++;sc.textContent=good;
        if(done===all){const p=good/all;end.innerHTML=`Результат: ${good} з ${all}<br>${p>=.9?"Чудово! ⭐⭐⭐":p>=.6?"Добре! ⭐⭐ Спробуй ще раз — вийде ще краще.":"Не засмучуйся! ⭐ Розгляни діаграми ще раз і спробуй знову."}<br><small>Натисни «Новий варіант» угорі, щоб пройти тест з новими числами.</small>`;end.className="end show";end.scrollIntoView({behavior:"smooth",block:"center"})}
      };
      sec.appendChild(box);
    });
    app.appendChild(sec);
  });
  sc.textContent=0;tot.textContent=all;
}
document.getElementById("reset").onclick=()=>{build();window.scrollTo({top:0,behavior:"smooth"})};
build();
</script>
